services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prn232-lms-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=PRN232_LMS_Lab01;Username=postgres;Password=12345
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: prn232-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: PRN232_LMS_Lab01
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    volumes:
      - prn232_lms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PRN232_LMS_Lab01"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prn232_lms_postgres_data:
